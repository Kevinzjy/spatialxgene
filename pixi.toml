# Spatialxgene: pixi manages the project environment (Python from conda-forge, node, R).
# Development: pixi run build   (build frontend)
# Deployment:  Use Singularity (SIF) or Docker for glibc compatibility (CentOS 7).
# Release:     make release     (build whl, docker tar, and singularity sif)

[workspace]
name = "spatialxgene"
version = "0.2.6"
authors = ["Jinyang Zhang <kevinzjy1997@gmail.com>"]
description = "Spatial transcriptomics processing tools & browser-based viewer"
license = "MIT"
readme = "README.md"
repository = "https://bioinfo.ioz.ac.cn/git/zhangjy/spatialxgene"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
preview = ["pixi-build"]

[package]
name = { workspace = true }
version = "0.2.6"
description = "Browser-based spatial transcriptomics viewer (cellxgene-style)"

[package.build]
backend = { name = "pixi-build-python", version = "*", channels = ["https://prefix.dev/conda-forge"] }

[package.host-dependencies]
setuptools = "==80.9.0"
wheel = "*"

[package.run-dependencies]
python = ">=3.9,<3.12"
anndata = ">=0.12.10,<0.13"
numpy = ">=2.3.5,<3"
setuptools = ">=82.0.0,<83"
scanpy = ">=1.11.5,<2"
leidenalg = ">=0.10.2,<0.11"
pandas = ">=2.3.3,<3"
h5py = ">=3.15.1,<4"
fastapi = ">=0.133.1,<0.134"
uvicorn = ">=0.41.0,<0.42"
pillow = ">=11.3.0,<13"
louvain = ">=0.8.2,<0.9"
r-base = ">=4.4.2,<4.6"
r-seurat = ">=5.1.0,<6"
python-dateutil = ">=2.9.0.post0,<3"

[package.build.config]
extra-input-globs = ["spatialxgene/frontend/dist/**"]
ignore-pypi-mapping = false

[dependencies]
python = ">=3.9,<3.12"
anndata = ">=0.12.10,<0.13"
numpy = ">=2.3.5,<3"
setuptools = ">=82.0.0,<83"
scanpy = ">=1.11.5,<2"
leidenalg = ">=0.10.2,<0.11"
pandas = ">=2.3.3,<3"
h5py = ">=3.15.1,<4"
fastapi = ">=0.133.1,<0.134"
uvicorn = ">=0.41.0,<0.42"
pillow = ">=11.3.0,<13"
louvain = ">=0.8.2,<0.9"
nodejs = ">=22.12.0,<23"
r-base = ">=4.4.2,<4.6"
r-seurat = ">=5.1.0,<6"
pytest = ">=9.0.2,<10"
httpx = ">=0.28.1,<0.29"
python-dateutil = ">=2.9.0.post0,<3"

[target.linux-64.dependencies]
playwright = ">=1.49.0"
nss = ">=3.118"
atk = ">=2.38"
pango = ">=1.56"
gtk3 = ">=3.24"
alsa-lib = ">=1.2"

[pypi-dependencies]
celltypist = ">=1.7.1, <2"
pytz = "*"

[tasks]
# Install frontend & spatialxgene package
install = "cd spatialxgene/frontend && npm install && npm run build && cd ../.. && pip install -e . --no-deps"

# Build frontend
build = { cmd = "cd spatialxgene/frontend && npm install && npm run build", cwd = "." }

# Launch viewer
launch = { cmd = "spatialxgene launch --data-dir $DATA_DIR --host $HOST --port $PORT", env = { DATA_DIR = "./tests/h5ad", HOST = "0.0.0.0", PORT = "5005" } }

# Build wheel package (using pip wheel to avoid conflict with local build/ folder)
whl = { cmd = "mkdir -p dist && pip wheel . --no-deps -w dist/" }

# Build docker image (for Docker Compose/Service deployment)
docker = "docker build -t spatialxgene:latest -f docker/Dockerfile ."

# Build and export docker image to versioned tar
docker-save = { cmd = "VERSION=$(python -c 'import spatialxgene; print(spatialxgene.__version__)') && pixi run docker && docker save spatialxgene:latest -o docker/spatialxgene-$VERSION.tar" }

# Build versioned Singularity Image Format (SIF) from exported docker tar
singularity-build = { cmd = "VERSION=$(python -c 'import spatialxgene; print(spatialxgene.__version__)') && singularity build docker/spatialxgene-$VERSION.sif docker-archive://docker/spatialxgene-$VERSION.tar" }

# Full Release Pipeline: whl + docker tar + singularity sif (all versioned)
release = { cmd = "pixi run build && pixi run whl && pixi run docker-save && pixi run singularity-build" }

# Test subcommands
test = { cmd = "tar -xvf tests/HCC1R.tar -C ./tests && spatialxgene visium2h5ad tests/HCC1R && rm -r tests/HCC1R && spatialxgene preprocess tests/HCC1R.h5ad && spatialxgene seurat2h5ad tests/P2N_Spatial.rds.gz && spatialxgene launch --data-dir ./tests --host $HOST --port $PORT --debug; rm -f tests/HCC1R*.h5ad tests/P2N_Spatial*.h5ad", env = { HOST = "0.0.0.0", PORT = "5005" } }

# Run backend unit tests
pytest = "pytest tests/ -v"

# Run frontend E2E tests
test-e2e = { cmd = "bash -lc 'set -e; pixi run spatialxgene launch --data-dir ./tests/h5ad --port 5005 --token \"\" & backend_pid=$!; cd spatialxgene/frontend && pixi run npx vite --host 127.0.0.1 --port 5173 & frontend_pid=$!; cleanup() { kill $backend_pid $frontend_pid 2>/dev/null || true; }; trap cleanup EXIT; sleep 10; cd spatialxgene/frontend && npx playwright test'", cwd = "." }

# Clean temporary files
clean = "rm -rf build dist spatialxgene/frontend/node_modules spatialxgene/frontend/dist spatialxgene/__pycache__ spatialxgene/*/__pycache__ .pytest_cache .ruff_cache .mypy_cache spatialxgene/frontend/tsconfig.tsbuildinfo spatialxgene.egg-info docker/spatialxgene-*.tar docker/spatialxgene-*.sif"

# Test docker deployment environment
docker-test = "docker compose -f docker/docker-compose.nginx-test.yml up --build"
