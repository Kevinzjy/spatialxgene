# Spatialxgene: pixi manages the project environment (Python from conda-forge, node, R).
# Run with: ~/.pixi/bin/pixi run <task>  or add ~/.pixi/bin to PATH and use pixi run <task>
# Conda package: enable pixi-build, then run `pixi run build` (frontend) before `pixi build`.
# See https://pixi.prefix.dev/latest/reference/pixi_manifest and docs/build/backends/pixi-build-python.md

[workspace]
name = "spatialxgene"
version = "0.2.4"
authors = ["Jinyang Zhang <kevinzjy1997@gmail.com>"]
description = "Spatial transcriptomics processing tools & browser-based viewer"
license = "MIT"
readme = "README.md"
repository = "https://bioinfo.ioz.ac.cn/git/zhangjy/spatialxgene"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
preview = ["pixi-build"]

[package]
name = { workspace = true } # Inherit the name from the workspace
version = "0.2.4"
description = "Browser-based spatial transcriptomics viewer (cellxgene-style)"

[package.build]
backend = { name = "pixi-build-python", version = "*", channels = ["https://prefix.dev/conda-forge"] }

[package.host-dependencies]
setuptools = "==80.9.0"
wheel = "*"

[package.build.config]
extra-input-globs = ["spatialxgene/frontend/dist/**"]
ignore-pypi-mapping = false

[package.run-dependencies]
python = "==3.9.23"
numpy = "==1.26.4"
setuptools = "==80.9.0"
scanpy = "==1.10.3"
anndata = "==0.10.9"
leidenalg = "==0.10.2"
pandas = "==2.3.1"
h5py = "==3.14.0"
fastapi = "==0.116.1"
uvicorn = "==0.35.0"
pillow = "==11.3.0"
louvain = "==0.8.2"

[dependencies]
python = "==3.9.23"
numpy = "==1.26.4"
setuptools = "==80.9.0"
scanpy = "==1.10.3"
anndata = "==0.10.9"
leidenalg = "==0.10.2"
pandas = "==2.3.1"
h5py = "==3.14.0"
fastapi = "==0.116.1"
uvicorn = "==0.35.0"
pillow = "==11.3.0"
louvain = "==0.8.2"
nodejs = "==25.2.1"
r-base = "==4.5.2"
r-seurat = "==5.4.0"

[pypi-dependencies]
celltypist = ">=1.7,<2"

[tasks]
# Install frontend & spatialxgene package
install = "cd spatialxgene/frontend && npm install && npm run build && cd ../.. && pip install -e . --no-deps"

# Build frontend
build = { cmd = "cd spatialxgene/frontend && npm run build", cwd = "." }

# Test subcommands
test = { cmd = "tar -xvf tests/HCC1R.tar -C ./tests && spatialxgene visium2h5ad tests/HCC1R && rm -r tests/HCC1R && spatialxgene preprocess tests/HCC1R.h5ad && spatialxgene seurat2h5ad tests/P2N_Spatial.rds.gz && spatialxgene launch --data-dir ./tests --host $HOST --port $PORT --debug; rm -f tests/HCC1R*.h5ad tests/P2N_Spatial*.h5ad", env = { HOST = "0.0.0.0", PORT = "5005" }, depends-on = ["build"] }

# Launch viewer
launch = { cmd = "spatialxgene launch --data-dir $DATA_DIR --host $HOST --port $PORT", env = { DATA_DIR = "./tests/h5ad", HOST = "0.0.0.0", PORT = "5005" }, depends-on = ["build"] }

# Clean temporary files
clean = "rm -rf build spatialxgene/frontend/node_modules spatialxgene/frontend/dist spatialxgene/__pycache__ spatialxgene/*/__pycache__ .pytest_cache .ruff_cache .mypy_cache spatialxgene/frontend/tsconfig.tsbuildinfo spatialxgene.egg-info"

# Build docker image
docker = "cd docker && docker compose build && docker save -o spatialxgene.tar docker-spatialxgene:latest"

# Test docker deployment environment
docker-test = "docker compose -f docker/docker-compose.nginx-test.yml up --build"
