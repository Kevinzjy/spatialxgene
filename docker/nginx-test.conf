# Used by docker-compose.nginx-test.yml: proxy to spatialxgene service (same network).
# Matches production: only location /spatialxgene/ (no extra /favicon.svg at root).

events { worker_connections 1024; }
http {
  server {
    listen 80;
    server_name localhost;
    location /spatialxgene/ {
      proxy_pass http://spatialxgene:5005/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
