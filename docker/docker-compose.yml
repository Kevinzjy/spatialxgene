services:
  spatialxgene:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5005:5005"
    volumes:
      - ../tests/h5ad:/data
    # When nginx proxies e.g. location /spatialxgene/ to this port, set so favicon/API/assets use that path
    environment:
      - SPATIALXGENE_API_BASE=spatialxgene
    command: ["--token", "${SPATIALXGENE_TOKEN:-}"]

    # Override token via environment, e.g. SPATIALXGENE_TOKEN=your-token; for subpath use SPATIALXGENE_API_BASE (above)
