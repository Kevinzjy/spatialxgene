[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialxgene"
version = "0.2.6"
description = "Browser-based spatial transcriptomics viewer (cellxgene-style)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy<2",
    "setuptools>=61,<81",
    "scanpy>=1.9",
    "anndata>=0.9",
    "leidenalg",
    "pandas",
    "h5py",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "Pillow>=9.0",
    "louvain>=0.7.1",
    "celltypist>=1.7,<2",
]

[project.scripts]
spatialxgene = "spatialxgene.cli:main"

[tool.setuptools.packages.find]
include = ["spatialxgene*"]

# Pre-built frontend (run "pixi run build" before packaging); R script for seurat2h5ad
[tool.setuptools.package-data]
spatialxgene = ["frontend/dist/*", "frontend/dist/**/*", "scripts/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore:.*pkg_resources is deprecated.*:UserWarning",
    "ignore:.*superseded by the.*leidenalg.*:DeprecationWarning",
]
