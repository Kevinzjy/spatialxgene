<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>SPATIALxGENE</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; box-sizing: border-box; }
      #root { height: 100%; width: 100%; min-height: 0; min-width: 0; display: flex; flex-direction: column; box-sizing: border-box; }
      @keyframes expression-loading-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      /* Subtle scrollbar for sidebar and inner lists */
      .sidebar-scroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.12) transparent;
      }
      .sidebar-scroll::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .sidebar-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.12);
        border-radius: 3px;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
